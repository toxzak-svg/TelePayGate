name: Quality Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  quality:
    name: jscpd + eslint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci --workspaces --no-audit --no-fund

      - name: Ensure reports directory exists
        run: mkdir -p docs/reports/jscpd-output

      - name: Run jscpd
        run: |
          npx jscpd@latest --config .jscpd.json --reporters json --output docs/reports/jscpd-output/

      - name: Fail on duplication threshold
        run: |
          node -e "
            const fs=require('fs');
            const dir='docs/reports/jscpd-output';
            const reportFile = fs.readdirSync(dir).find(f => f.endsWith('.json'));
            if(!reportFile){console.error('jscpd output missing'); process.exit(1);}
            const r=JSON.parse(fs.readFileSync(dir + '/' + reportFile));
            const dup=(r.statistics && r.statistics.duplicates) || 0;
            console.log('jscpd duplicates:',dup);
            if(dup>50){console.error('Duplication threshold exceeded (>50 duplicates)'); process.exit(1);}
          "

      - name: Run ESLint
        run: npm run lint

      - name: Upload jscpd report
        uses: actions/upload-artifact@v4
        with:
          name: jscpd-report
          path: docs/reports/jscpd-output/
