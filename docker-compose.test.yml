version: '3.8'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tg_user
      POSTGRES_PASSWORD: tg_pass
      POSTGRES_DB: telepaygate_test
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tg_user"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - 6379:6379

  mailhog:
    image: mailhog/mailhog
    ports:
      - 1025:1025
      - 8025:8025
