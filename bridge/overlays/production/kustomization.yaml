apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: telepaygate
namePrefix: prod-
commonLabels:
  environment: production
bases:
  - ../../base
patchesStrategicMerge:
  - configmap-patch.yaml
  - api-deployment-patch.yaml
  - db-deployment-patch.yaml
  - redis-deployment-patch.yaml
  - ingress-patch.yaml
images:
  - name: telepaygate-api
    newName: your-registry/telepaygate-api
    newTag: latest
  - name: postgres
    newName: postgres
    newTag: "16"
  - name: redis
    newName: redis
    newTag: "7-alpine"
